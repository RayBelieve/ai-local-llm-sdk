[package]
name = "model-sdk-workbench"
version = "0.1.0"
description = "Model SDK debug console"
authors = ["Model SDK Workbench"]
edition = "2021"

[lib]
name = "model_sdk_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
model-sdk = { path = "../crates/model-sdk" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
