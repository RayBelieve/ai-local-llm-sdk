[package]
name = "model-sdk"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "socks"] }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
zip = "2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
